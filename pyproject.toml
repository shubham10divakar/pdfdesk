[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pdfdesk"
dynamic = ["version"]
description = "A local-first workspace for reading research papers: PDF reader, highlights, notes, search and a history of your reading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Subham Divakar" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["pdf", "research", "papers", "reader", "notes", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/shubham10divakar/pdfdesk"
Source = "https://github.com/shubham10divakar/pdfdesk"
Issues = "https://github.com/shubham10divakar/pdfdesk/issues"
Roadmap = "https://github.com/shubham10divakar/pdfdesk/blob/main/docs/roadmap.md"

[project.scripts]
pdfdesk = "pdfdesk.cli:main"

[tool.hatch.version]
path = "pdfdesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pdfdesk"]

# The browser app stays in prototype/ (no build step there); the wheel carries a copy as pdfdesk/static/.
[tool.hatch.build.targets.wheel.force-include]
"prototype" = "pdfdesk/static"

[tool.hatch.build.targets.sdist]
include = ["pdfdesk", "prototype", "README.md", "LICENSE", "pyproject.toml"]
