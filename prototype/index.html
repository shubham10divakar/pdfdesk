<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDFDesk</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<button class="icon-b side-open" id="sideOpen" data-act="side" title="Show the sidebar ( [ )" aria-label="Show the library sidebar" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg></button>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div class="selpop" id="selpop" hidden>
  <button class="sw" style="--c:var(--hl-yellow)" data-act="hl" data-v="yellow" aria-label="Highlight yellow" title="Key idea"></button>
  <button class="sw" style="--c:var(--hl-green)" data-act="hl" data-v="green" aria-label="Highlight green" title="Method / result"></button>
  <button class="sw" style="--c:var(--hl-blue)" data-act="hl" data-v="blue" aria-label="Highlight blue" title="Definition"></button>
  <button class="sw" style="--c:var(--hl-pink)" data-act="hl" data-v="pink" aria-label="Highlight pink" title="Question / doubt"></button>
  <span class="sep"></span>
  <button class="btn" data-act="hl-note">Add note</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="netbar" id="netbar" role="alert" hidden><b>PDFDesk isn't running, so changes aren't being saved.</b> Run <code>pdfdesk</code> again; this page saves as soon as it's back.</div>
<div class="leftbar" id="leftbar" role="status" hidden></div>
<div class="drop" id="drop" hidden><div>Drop PDFs to add them, or a PDFDesk export to import it</div></div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="attachIn" accept="application/pdf,.pdf" hidden>
<input type="file" id="impIn" accept=".zip,.json,application/zip,application/json" hidden>
<div class="modal" id="modal" hidden></div>

<!-- PDF.js 3.11.174 (UMD), vendored so the app works offline. Loading the worker as a plain script makes
     PDF.js run its parser on the main thread, which avoids worker setup across file:// and custom origins. -->
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdfjs/pdf.worker.min.js"></script>
<script src="app.js"></script>
</body>
</html>
